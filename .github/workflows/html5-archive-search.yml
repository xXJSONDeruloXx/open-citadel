name: Search Epic Citadel web archives

on:
  push:
    branches:
      - feat/html5-revival
    paths:
      - ".github/workflows/html5-archive-search.yml"
      - "tools/html5_federated_archive_probe.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: html5-archive-search
  cancel-in-progress: true

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Search independent archives and catalogs
        run: python3 tools/html5_federated_archive_probe.py
