name: Deploy Citadel web preview

on:
  push:
    branches: [feat/html5-revival]
    paths:
      - "web/**"
      - ".github/workflows/html5-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate static site
        run: |
          test -s web/index.html
          test -s web/main.js
          test -s web/style.css
          grep -Eq "EpicCitadel\\.(gltf|glb)" web/main.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
