name: Epic Citadel HTML5 browser smoke

on:
  push:
    branches:
      - feat/html5-revival
    paths:
      - ".github/workflows/html5-revival-probe.yml"
      - "tools/html5_recover.py"
      - "tools/html5_browser_smoke.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: html5-revival-browser-smoke
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Recover archived Epic Citadel deployment
        run: python3 tools/html5_recover.py html5-runtime

      - name: Inspect recovered runtime
        run: |
          du -h html5-runtime/* | sort -h
          file html5-runtime/UDKGame_Data.js                html5-runtime/UDKGame_Data.data                html5-runtime/UDKGame-Browser-Shipping.js                html5-runtime/UDKGame-Browser-Shipping.js.mem
          test -s html5-runtime/UDKGame_Data.data
          test -s html5-runtime/UDKGame-Browser-Shipping.js.mem

      - name: Start local web server
        run: |
          python3 -m http.server 8000 --directory html5-runtime > /tmp/open-citadel-http.log 2>&1 &
          echo $! > /tmp/open-citadel-http.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8000/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/open-citadel-http.log
          exit 1

      - name: Set up browser test
        run: |
          python3 -m pip install --disable-pip-version-check "selenium>=4.20,<5"
          (google-chrome --version || chromium --version || chromium-browser --version || true)
          (chromedriver --version || true)

      - name: Run Epic Citadel in headless Chrome
        run: python3 tools/html5_browser_smoke.py http://127.0.0.1:8000/ --seconds 35

      - name: Show server log
        if: always()
        run: cat /tmp/open-citadel-http.log 2>/dev/null || true

      - name: Remove recovered Epic files
        if: always()
        run: rm -rf html5-runtime
